[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "technical-docs-assistant"
version = "0.1.0"
description = "通过一个可评估的文档助手系统学习 LlamaIndex"
requires-python = ">=3.11"
dependencies = [
  "llama-index-core>=0.14,<0.15",
  "llama-index-llms-ollama>=0.11,<0.12",
  "llama-index-embeddings-ollama>=0.10,<0.11",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-dotenv>=1,<2",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
rerank = ["sentence-transformers>=3,<6"]
[project.scripts]
doc-assistant = "doc_assistant.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/doc_assistant"]
[tool.pytest.ini_options]
testpaths = ["tests"]
